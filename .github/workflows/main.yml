name: every3hrs-commit
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours at minute 17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update log
        run: |
          date -u > last-run.txt
          git config user.name "Marcyuhhh"
          git config user.email "eurese.mar.ariel@gmail.com"
          git add last-run.txt
          git commit -m "chore: update $(date -u +%F-%H%M)"
          git push
